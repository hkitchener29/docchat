[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docchat"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "groq",
    "python-dotenv",
]

[project.scripts]
chat = "chat:repl"

[tool.setuptools]
py-modules = ["chat"]

[tool.pytest.ini_options]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
